<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="After Hours League.">
  <title>After Hours League</title>
  <link rel="icon" href="after-hours-logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main aria-label="After Hours League">
    <div class="logo-stage">
      <img class="logo" src="after-hours-logo.png" width="1254" height="1254" alt="After Hours League" fetchpriority="high" draggable="false">
    </div>
  </main>
  <button class="motion-toggle" type="button" aria-label="Pause logo animation" aria-pressed="false">
    <svg class="pause-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <svg class="play-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 9 6-9 6Z" fill="currentColor"/></svg>
    <span>Pause motion</span>
  </button>
  <script src="script.js"></script>
</body>
</html>
